services:
  # ── Django Web API ─────────────────────────────────────────────────────────
  - type: web
    name: headroom-api
    runtime: python
    rootDir: services/django-backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --log-level info
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: headroom-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: headroom-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: headroom-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: headroom-redis
          property: connectionString
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: LOG_LEVEL
        value: INFO
      # Set these manually in Render dashboard after deploy:
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

  # ── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: headroom-celery
    runtime: python
    rootDir: services/django-backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A celery_app worker --loglevel=info --concurrency=2
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: headroom-api
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: headroom-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: headroom-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: headroom-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: headroom-redis
          property: connectionString

  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: headroom-redis
    plan: free
    maxmemoryPolicy: noeviction

databases:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  - name: headroom-db
    plan: free
    databaseName: headroom
    user: headroom_user
